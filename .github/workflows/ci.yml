name: OC-01 checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  rights-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - '127.0.0.1:5432:5432'
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B packages/db/test_migrations.py
      - run: python3 -B packages/ingest/parse/test_usfm.py -v

  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check the source gate with offline fixtures
        run: python3 -B packages/ingest/test_pilot.py -v
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level high
      - run: pnpm services:up
      - run: pnpm services:status
      - if: always()
        run: pnpm services:down
